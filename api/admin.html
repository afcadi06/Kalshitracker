<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalshi Tracker Admin</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: #050706; color: #f6fff9; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 18px; }
    .card { background: #101511; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    h1, h2 { margin: 0 0 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input { background: rgba(255,255,255,.08); color: #f6fff9; border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 8px; }
    input[type="text"], input[type="password"] { min-width: 240px; }
    button { background: #00d395; color: #080c09; border: 0; border-radius: 999px; padding: 8px 13px; cursor: pointer; font-weight: 800; }
    button.secondary { background: rgba(255,255,255,.08); color: #f6fff9; border: 1px solid rgba(255,255,255,.16); }
    button.danger { background: #b42318; color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid rgba(255,255,255,.1); padding: 7px; text-align: left; vertical-align: top; }
    th { color: #aeb9b0; text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
    .muted { color: #aeb9b0; }
    .ok { color: #00d395; }
    .err { color: #ff8a80; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 11px; }
    .pill.live { background: rgba(0,211,149,.16); color: #00d395; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Kalshi Tracker Admin</h1>
    <section class="card">
      <div class="row">
        <label>Admin key</label>
        <input id="adminKey" type="password" placeholder="x-admin-key">
        <button id="loadBtn">Load</button>
        <span id="status" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>Access Control</h2>
      <div class="row">
        <label><input id="enabled" type="checkbox"> Access enabled</label>
        <label>App ID</label>
        <input id="appId" type="text">
        <label>Daily password</label>
        <input id="dailyPassword" type="text">
        <button id="saveBtn">Save</button>
      </div>
    </section>

    <section class="card">
      <h2>Active Sessions</h2>
      <table>
        <thead><tr><th>User</th><th>Device</th><th>Status</th><th>Created</th><th>Last Seen</th><th>Expires</th><th>IP</th><th></th></tr></thead>
        <tbody id="sessionRows"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Recent Login Events</h2>
      <table>
        <thead><tr><th>When</th><th>User</th><th>Device</th><th>IP</th><th>Event</th></tr></thead>
        <tbody id="eventRows"></tbody>
      </table>
    </section>
  </main>

  <script>
    const el = id => document.getElementById(id);

    function setStatus(message, isError = false) {
      el("status").textContent = message || "";
      el("status").className = isError ? "err" : "ok";
    }

    function adminFetch(url, options = {}) {
      return fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          "x-admin-key": el("adminKey").value.trim()
        }
      });
    }

    function fmt(time) {
      if (!time) return "";
      const date = new Date(time);
      return Number.isNaN(date.getTime()) ? String(time) : date.toLocaleString();
    }

    async function loadData() {
      try {
        const response = await adminFetch("/admin/data");
        const payload = await response.json();
        if (!payload.ok) throw new Error(payload.message || "Load failed.");
        const data = payload.data || {};
        el("enabled").checked = Boolean(data.enabled);
        el("appId").value = data.appId || "";
        el("dailyPassword").value = data.dailyPassword || "";

        el("sessionRows").innerHTML = (data.activeSessions || []).map(session => `
          <tr>
            <td>${session.username || ""}</td>
            <td>${session.deviceId || ""}</td>
            <td><span class="pill ${session.online ? "live" : ""}">${session.online ? "online" : "idle"}</span></td>
            <td>${fmt(session.createdAt)}</td>
            <td>${fmt(session.lastSeenAt)}</td>
            <td>${fmt(session.expiresAt)}</td>
            <td>${session.ip || ""}</td>
            <td><button class="danger" data-token="${session.token}">Revoke</button></td>
          </tr>
        `).join("") || '<tr><td colspan="8" class="muted">No active sessions</td></tr>';

        el("eventRows").innerHTML = (data.loginEvents || []).map(event => `
          <tr>
            <td>${fmt(event.at)}</td>
            <td>${event.username || ""}</td>
            <td>${event.deviceId || ""}</td>
            <td>${event.ip || ""}</td>
            <td>${event.event || ""}</td>
          </tr>
        `).join("") || '<tr><td colspan="5" class="muted">No events</td></tr>';

        setStatus("Loaded.");
      } catch (error) {
        setStatus(error.message || "Load failed.", true);
      }
    }

    async function saveData() {
      try {
        const response = await adminFetch("/admin/update", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            enabled: el("enabled").checked,
            appId: el("appId").value.trim(),
            dailyPassword: el("dailyPassword").value.trim()
          })
        });
        const payload = await response.json();
        if (!payload.ok) throw new Error(payload.message || "Save failed.");
        setStatus("Saved.");
        loadData();
      } catch (error) {
        setStatus(error.message || "Save failed.", true);
      }
    }

    async function revoke(token) {
      if (!confirm("Revoke this session?")) return;
      const response = await adminFetch("/admin/revoke-session", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token })
      });
      const payload = await response.json();
      if (!payload.ok) return setStatus(payload.message || "Revoke failed.", true);
      setStatus("Session revoked.");
      loadData();
    }

    el("loadBtn").addEventListener("click", loadData);
    el("saveBtn").addEventListener("click", saveData);
    el("sessionRows").addEventListener("click", event => {
      const button = event.target.closest("[data-token]");
      if (button) revoke(button.dataset.token);
    });
  </script>
</body>
</html>
